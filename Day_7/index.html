<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">
        <h1>Guess The Number</h1>
        <p class="describe">I have chosen a number between. <strong>1 and 100</strong> can you guess it?</p>
     <div class="gameinfo">
        <div>
            <span>Attempts</span>
            <strong id="attempts">0</strong>
        </div>
        <div>
            <span>Score</span>
            <strong id="score">100</strong>
        </div>
        <div>
            <span>Best Score</span>
            <strong>0</strong>
        </div>
     </div>
     <div class="inputsec">
        <input type="number" id="guessinput" placeholder="Enter a number" min="1" max="100">
        <button id="guessbtn">Guess</button>
     </div>
     <p id="message">Make a guess by entering a number</p>
     <div class="prevguesses">
        <h3>Previous Guesses</h3>
        <div id="guesslist"></div>
     </div>
      <button id="newgamebtn" class="newgame">New Game</button>
     </div>
    <script src="script.js"></script>
</body>
</html>
