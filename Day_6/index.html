<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>areacalculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Area Calculator</h1>
        <p>Calculate the area of different shapes</p>

        <label for="shape">Choose a shape:</label>
        <select id="shape">
            <option value="circle">Circle</option>
            <option value="rectangle">Rectangle</option>
            <option value="triangle">Triangle</option>
        </select>

        <div id="circleinputs" class="shapeinputs">
            <label for="radius">Radius:</label>
            <input type="number" id="radius" placeholder="Enter radius">
        </div>

        <div id="rectangleinputs" class="shapeinputs hidden">
            <label for="length">Length:</label>
            <input type="number" id="length" placeholder="Enter length">

            <label for="width">Width:</label>
            <input type="number" id="width" placeholder="Enter width">
        </div>

        <div id="trianleinputs" class="shapeinputs hidden">
            <label for="length">Length:</label>
            <input type="number" id="length" placeholder="Enter Length">

            <label for="width">Width:</label>
            <input type="number" id="width" placeholder="Enter width">
        </div>

        <button id="calculatebtn">Calculate Area</button>

        <div id="result">
            Area will appear here
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
